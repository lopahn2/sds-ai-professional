apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveprobe-application-source
  namespace: liveprobe-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liveprobe-application-qa
  namespace: liveprobe-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liveprobe-application-source
  namespace: dev
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [order, inventory, catalog, payment, trade-member, delivery, notification, delivery-member, business-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liveprobe-application-source
  namespace: dev
subjects:
  - {kind: ServiceAccount, name: liveprobe-application-source, namespace: liveprobe-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: liveprobe-application-source}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liveprobe-application-source
  namespace: prd
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [order, inventory, catalog, payment, trade-member, delivery, notification, delivery-member, business-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liveprobe-application-source
  namespace: prd
subjects:
  - {kind: ServiceAccount, name: liveprobe-application-source, namespace: liveprobe-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: liveprobe-application-source}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liveprobe-application-qa
  namespace: dev
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [order, inventory, catalog, payment, trade-member, delivery, notification, delivery-member, business-api]
    verbs: [get]
  - {apiGroups: [apps], resources: [replicasets], verbs: [list]}
  - {apiGroups: [""], resources: [pods], verbs: [list]}
  - {apiGroups: [""], resources: [services/proxy], resourceNames: ["http:inventory:8080"], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liveprobe-application-qa
  namespace: dev
subjects:
  - {kind: ServiceAccount, name: liveprobe-application-qa, namespace: liveprobe-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: liveprobe-application-qa}
