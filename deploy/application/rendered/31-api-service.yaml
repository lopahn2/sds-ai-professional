{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "liveprobe-application-api",
    "namespace": "liveprobe-system",
    "labels": {
      "app.kubernetes.io/part-of": "liveprobe-application"
    }
  },
  "spec": {
    "selector": {
      "app": "liveprobe-application-api"
    },
    "ports": [
      {
        "name": "http",
        "port": 8080,
        "targetPort": "http"
      }
    ]
  }
}
