{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "liveprobe-application-db",
    "namespace": "liveprobe-system",
    "labels": {
      "app.kubernetes.io/part-of": "liveprobe-application"
    }
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "liveprobe-application-db"
      }
    },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "liveprobe-application-api"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 5432
          }
        ]
      }
    ],
    "egress": []
  }
}
