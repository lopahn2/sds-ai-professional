{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "liveprobe-application-codex",
    "namespace": "liveprobe-system",
    "labels": {
      "app.kubernetes.io/part-of": "liveprobe-application"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "local-path",
    "resources": {
      "requests": {
        "storage": "1Gi"
      }
    }
  }
}
