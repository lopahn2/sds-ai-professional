{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "liveprobe-application-api",
    "namespace": "liveprobe-system",
    "labels": {
      "app.kubernetes.io/part-of": "liveprobe-application"
    }
  },
  "spec": {
    "ingressClassName": "traefik",
    "rules": [
      {
        "host": "application.liveprobe.localhost",
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "liveprobe-application-api",
                  "port": {
                    "number": 8080
                  }
                }
              }
            }
          ]
        }
      }
    ]
  }
}
