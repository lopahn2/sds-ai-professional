{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "liveprobe-application-db",
    "namespace": "liveprobe-system",
    "labels": {
      "app.kubernetes.io/part-of": "liveprobe-application"
    }
  },
  "spec": {
    "clusterIP": "None",
    "selector": {
      "app": "liveprobe-application-db"
    },
    "ports": [
      {
        "name": "postgres",
        "port": 5432,
        "targetPort": "postgres"
      }
    ]
  }
}
