apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# LP-OBS-20261114: standalone, DISABLED Grafana recovery unit (replicas 0, no PVC/Service/Ingress/Policy).
# Intentionally outside deploy/base, deploy/base/observability and every overlay; never list it there.
# The data PVC `grafana-data` is owned by deploy/base/observability/grafana/grafana-data-pvc.yaml.
# Read deploy/retired/grafana/grafana.yaml before any operator-approved recovery.
resources:
  - grafana.yaml
