[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samsung-domain"
version = "1.0.0"
description = "삼성 합성 업무 원장·회원·동기화 런타임"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==0.52.1",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "confluent-kafka==2.16.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "build==1.6.1"]

[project.scripts]
samsung-domain = "samsung_domain.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samsung_domain = ["*.sql", "*.html"]
