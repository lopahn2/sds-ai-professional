spring.application.name=inventory
server.port=8080
server.shutdown=graceful
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
# Readiness/liveness deliberately exclude the database (KAN-67): a DB outage or pool exhaustion must
# surface as bounded 503s on the data path (Family 3), not as Endpoint loss (Family 4) or restarts.
# DB state is still reported by /actuator/health (db component) and by hikaricp_* metrics.
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=inventory
logging.structured.format.console=ecs

# Dedicated inventory database and role; never the LiveProbe credentials. Values are injected from the
# inventory-db ConfigMap/Secret in liveprobe-target. Nothing secret is stored here.
spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://postgres.liveprobe-system.svc:5432/inventory}
spring.datasource.username=${INVENTORY_DB_USER:inventory}
spring.datasource.password=${INVENTORY_DB_PASSWORD:}
# Schema + fixture are provisioned by scripts/provision-inventory-db.sh, not at startup, so a DB outage
# never becomes a crash loop.
spring.sql.init.mode=never
spring.datasource.hikari.pool-name=inventory
spring.datasource.hikari.maximum-pool-size=${INVENTORY_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=${INVENTORY_DB_CONNECTION_TIMEOUT_MS:1000}
spring.datasource.hikari.validation-timeout=500
# Start even if the DB is down (requests return 503 until it is back).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.ApplicationName=inventory
