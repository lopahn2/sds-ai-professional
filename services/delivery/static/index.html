<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배송 추적 · 라이브프로브</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body><header><div class="top"><span class="brand">라이브프로브 · 업무 실험실</span><span class="badge" id="environment">환경 확인 중</span></div></header><main><div class="intro"><h1>배송 추적</h1><p class="muted">송장을 등록하고 배송 단계를 변경합니다. 예정일이 지난 배송은 지연 목록에서 확인할 수 있습니다.</p></div>
<div class="work-grid"><section class="panel"><h2>송장 등록</h2><form id="register"><div class="field"><label for="tracking">송장 번호</label><input id="tracking" name="tracking" required pattern="[A-Za-z0-9-]{3,32}" maxlength="32" placeholder="예: LP1003"></div><div class="field"><label for="recipient">수령인</label><input id="recipient" name="recipient" required maxlength="40" placeholder="예: 김하늘"></div><div class="field"><label for="dueAt">도착 예정일</label><input id="dueAt" name="dueAt" type="text" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}" maxlength="16" placeholder="예: 2026-10-25 18:00" required></div><button type="submit">송장 등록</button></form><p class="steps result">접수 → 출고 → 배송 중 → 완료</p></section><section class="panel"><div class="row"><h2>배송 현황</h2><span id="count" class="count">조회 중</span></div><form id="search"><div class="search"><div class="field"><label for="query">송장 번호 또는 수령인</label><input id="query" name="search" maxlength="80" placeholder="예: LP1001"></div><button type="submit" class="secondary">조회</button></div><label class="check"><input type="checkbox" id="delayed" name="delayed">지연 배송만 보기</label></form><div id="deliveries" class="list" aria-live="polite"><p class="empty">배송 정보를 불러오고 있습니다.</p></div></section></div><p id="notice" class="notice" role="status">업무 요청 결과가 여기에 표시됩니다.</p><section class="panel chaos" aria-labelledby="chaos-title"><div class="chaos-head"><h2 id="chaos-title">장애 실험</h2><p class="help">현재 인스턴스에 실제 장애를 주입합니다. 메모리 증가와 프로세스 종료는 재시작이 필요할 수 있습니다.</p></div><div id="faults" class="faults"></div><div class="tools"><button id="replay" class="secondary" type="button">업무 요청 즉시 재현</button><button id="reset" class="secondary" type="button">장애 모두 해제</button></div><p id="chaos-note" class="help result" role="status">장애 상태를 확인하고 있습니다.</p></section></main><footer><span>메모리 저장 · 재시작하면 초기화됩니다</span><span id="version">버전 확인 중</span></footer></body></html>
