spring.application.name=order
server.port=8080
server.shutdown=graceful
inventory.base-url=${INVENTORY_URL:http://inventory:8080}
# Worst case per request: 2 attempts x (connect 500ms + read 1800ms) + 100ms backoff = 4.7s,
# strictly below the loadgen/e2e client timeout of 5s (deploy/base/target/target.yaml).
inventory.connect-timeout-ms=${INVENTORY_CONNECT_TIMEOUT_MS:500}
inventory.timeout-ms=${INVENTORY_TIMEOUT_MS:1800}
inventory.max-retries=${INVENTORY_MAX_RETRIES:1}
inventory.retry-backoff-ms=${INVENTORY_RETRY_BACKOFF_MS:100}
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
# KAN-96 contract 2.5: probe groups never include db, so endpoint_off is the only readiness lever.
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
management.metrics.tags.application=order
management.metrics.distribution.slo.http.server.requests=500ms
logging.structured.format.console=ecs
# Only the fixed OrderUiController allowlist serves UI content; generic static mappings stay disabled.
# Unmapped paths (e.g. /internal/chaos/** outside the chaos profile) must be 404 for every method,
# not 405 from the static resource handler.
spring.web.resources.add-mappings=false

# KAN-96 contract 3: order DB. No DataSource and no connection attempts unless ORDER_DB_ENABLED=true
# (set only by deploy/overlays/rancher-desktop-chaos). DataSourceAutoConfiguration is excluded in
# OrderApplication; the pool is built by OrderDbConfig.
order.db.enabled=${ORDER_DB_ENABLED:false}
order.db.url=${ORDER_DB_URL:}
order.db.user=${ORDER_DB_USER:order_app}
order.db.password=${ORDER_DB_PASSWORD:}
order.db.pool-max=${ORDER_DB_POOL_MAX:4}
order.db.connection-timeout-ms=${ORDER_DB_CONNECTION_TIMEOUT_MS:1000}

# KAN-96 contract 1.6: durable crash/oom intent dir (chaos overlay emptyDir). Blank = unavailable (503).
chaos.state-dir=${CHAOS_STATE_DIR:}
chaos.cgroup-root=/sys/fs/cgroup
