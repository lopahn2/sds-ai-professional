worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # The marker prevents a loop for HTML already forwarded by the gateway.
  # It grants no API access. This server only serves public dashboard assets.
  map "$request_method|$host|$http_x_liveprobe_local_view|$http_accept" $local_document {
    default 0;
    "~*^(GET|HEAD)[|]liveprobe[.]localhost[|][|].*text/html" 1;
  }
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /assets/ { try_files $uri =404; }
    location / {
      if ($local_document) {
        add_header Cache-Control no-store always;
        return 307 http://127.0.0.1:4175$request_uri;
      }
      try_files $uri /index.html;
    }
  }
}
